version: "3.4"

services:
    packrat-client-dev:
        container_name: packrat-client-dev
        image: "packrat-client-dev:${IMAGE_TAG}"
        restart: always
        build:
            context: ../..
            dockerfile: ./conf/docker/client-dev.Dockerfile
            target: client
        ports:
            - $PACKRAT_CLIENT_PORT:3000
        environment:
            - NODE_ENV=$NODE_ENV
            - REACT_APP_PACKRAT_SERVER_ENDPOINT=$REACT_APP_PACKRAT_SERVER_ENDPOINT

    packrat-client-prod:
      container_name: packrat-client-prod
      image: "packrat-client-prod:${IMAGE_TAG}"
      restart: always
      build:
            context: ../..
            dockerfile: ./conf/docker/client-prod.Dockerfile
            target: client
      ports:
          - $PACKRAT_CLIENT_PORT:3000
      environment:
          - NODE_ENV=$NODE_ENV
          - REACT_APP_PACKRAT_SERVER_ENDPOINT=$REACT_APP_PACKRAT_SERVER_ENDPOINT

    packrat-client-inspect:
        container_name: packrat-client-inspect
        image: "packrat-client-dev:${IMAGE_TAG}"
        restart: always
        build:
            context: ../..
            dockerfile: ./conf/docker/client-dev.Dockerfile
            target: client
        ports:
            - $PACKRAT_CLIENT_PORT:3000
        environment:
            - NODE_ENV=$NODE_ENV
            - REACT_APP_PACKRAT_SERVER_ENDPOINT=$REACT_APP_PACKRAT_SERVER_ENDPOINT

    packrat-server-dev:
        container_name: packrat-server-dev
        image: "packrat-server-dev:${IMAGE_TAG}"
        restart: always
        build:
            context: ../..
            dockerfile: ./conf/docker/server-dev.Dockerfile
            target: server
        ports:
            - $PACKRAT_SERVER_PORT:4000
        # Inject the whole env file so every PACKRAT_* variable (and any added later) reaches the
        # container — no per-variable allow-list to keep in sync. This service is the staging deploy
        # (deploy.sh dev), so it always loads .env.dev. Path is relative to this compose file.
        env_file:
            - ../../.env.dev

        volumes:
            - $PACKRAT_OCFL_STORAGE_ROOT:$PACKRAT_OCFL_STORAGE_ROOT
            - $PACKRAT_OCFL_STAGING_ROOT:$PACKRAT_OCFL_STAGING_ROOT
            - $PACKRAT_LOG_ROOT:$PACKRAT_LOG_ROOT
            - $PACKRAT_EDAN_STAGING_ROOT:$PACKRAT_EDAN_STAGING_ROOT
            - $PACKRAT_EDAN_RESOURCES_HOTFOLDER:$PACKRAT_EDAN_RESOURCES_HOTFOLDER
            - /data/Packrat/digitization:/data/Packrat/digitization
            - /etc/ssl/certs:/etc/ssl/certs

    packrat-server-prod:
        container_name: packrat-server-prod
        image: "packrat-server-prod:${IMAGE_TAG}"
        restart: always
        build:
            context: ../..
            dockerfile: ./conf/docker/server-prod.Dockerfile
            target: server
        ports:
            - $PACKRAT_SERVER_PORT:4000
        # Inject the whole env file so every PACKRAT_* variable (and any added later) reaches the
        # container — no per-variable allow-list to keep in sync. This service is the production deploy
        # (deploy.sh prod), so it always loads .env.prod. Path is relative to this compose file.
        env_file:
            - ../../.env.prod

        volumes:
            - $PACKRAT_OCFL_STORAGE_ROOT:$PACKRAT_OCFL_STORAGE_ROOT
            - $PACKRAT_OCFL_STAGING_ROOT:$PACKRAT_OCFL_STAGING_ROOT
            - $PACKRAT_LOG_ROOT:$PACKRAT_LOG_ROOT
            - $PACKRAT_EDAN_STAGING_ROOT:$PACKRAT_EDAN_STAGING_ROOT
            - $PACKRAT_EDAN_RESOURCES_HOTFOLDER:$PACKRAT_EDAN_RESOURCES_HOTFOLDER
            - /data/Packrat/digitization:/data/Packrat/digitization
            - /etc/ssl/certs:/etc/ssl/certs

    packrat-server-inspect:
        container_name: packrat-server-inspect
        image: "packrat-server-inspect:${IMAGE_TAG}"
        restart: always
        build:
            context: ../..
            dockerfile: ./conf/docker/server-inspect.Dockerfile
            target: server
        ports:
            - $PACKRAT_SERVER_PORT:4000
            - 9229:9230
        # Inject the whole env file so every PACKRAT_* variable (and any added later) reaches the
        # container — no per-variable allow-list to keep in sync. This is the debug build (deploy.sh
        # inspect), so it loads .env.inspect. NODE_OPTIONS stays inline (debug-only, not in the env file).
        env_file:
            - ../../.env.inspect
        environment:
            - NODE_OPTIONS=--inspect

        volumes:
            - $PACKRAT_OCFL_STORAGE_ROOT:$PACKRAT_OCFL_STORAGE_ROOT
            - $PACKRAT_OCFL_STAGING_ROOT:$PACKRAT_OCFL_STAGING_ROOT
            - $PACKRAT_LOG_ROOT:$PACKRAT_LOG_ROOT
            - $PACKRAT_EDAN_STAGING_ROOT:$PACKRAT_EDAN_STAGING_ROOT
            - $PACKRAT_EDAN_RESOURCES_HOTFOLDER:$PACKRAT_EDAN_RESOURCES_HOTFOLDER
            - /data/Packrat/digitization:/data/Packrat/digitization
            - /etc/ssl/certs:/etc/ssl/certs

    packrat-db-dev:
        container_name: packrat-db-dev
        image: mariadb:10.5
        restart: always
        ports:
            - $PACKRAT_DB_PORT:3306
        environment:
            - MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
        volumes:
            - ../../server/db/sql:/app/

    packrat-db-prod:
        container_name: packrat-db-prod
        image: mariadb:10.5
        restart: always
        ports:
            - $PACKRAT_DB_PORT:3306
        environment:
            - MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
        volumes:
            - ../../server/db/sql:/app/

    packrat-solr-dev:
        container_name: packrat-solr-dev
        image: "packrat-solr-dev:${IMAGE_TAG}"
        restart: always
        build:
            context: ../..
            dockerfile: ./conf/docker/solr.Dockerfile
            target: solr
        ports:
            - $PACKRAT_SOLR_PORT:8983
        environment:
            - PACKRAT_SOLR_HOST=packrat-solr-dev
            
    packrat-solr-prod:
        container_name: packrat-solr-prod
        image: "packrat-solr-prod:${IMAGE_TAG}"
        restart: always
        build:
            context: ../..
            dockerfile: ./conf/docker/solr.Dockerfile
            target: solr
        ports:
            - $PACKRAT_SOLR_PORT:8983
        environment:
            - PACKRAT_SOLR_HOST=packrat-solr-prod

    packrat-solr-inspect:
        container_name: packrat-solr-inspect
        image: "packrat-solr-dev:${IMAGE_TAG}"
        restart: always
        build:
            context: ../..
            dockerfile: ./conf/docker/solr.Dockerfile
            target: solr
        ports:
            - $PACKRAT_SOLR_PORT:8983
        environment:
            - PACKRAT_SOLR_HOST=packrat-solr-inspect
            
networks:
    default:
        driver: bridge
        enable_ipv6: false
        ipam:
            config:
                - subnet: 192.168.4.0/24
